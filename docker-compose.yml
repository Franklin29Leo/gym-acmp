services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gimnasio}
      POSTGRES_USER: ${POSTGRES_USER:-gimnasio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: America/Lima
    volumes:
      - pgdata:/var/lib/postgresql/data
      # solo se ejecuta la primera vez (cuando el volumen está vacío)
      - ./gimnasio.sql:/docker-entrypoint-initdb.d/01-gimnasio.sql:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: gimnasio-intranet:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gimnasio}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gimnasio}
      ZONA_HORARIA: ${ZONA_HORARIA:-America/Lima}
      DIAS_POR_VENCER: ${DIAS_POR_VENCER:-5}
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  pgdata:
